apiVersion: v1
kind: Secret
metadata:
  name: {{ include "velox.fullname" . }}
  labels:
    {{- include "velox.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database
  MONGODB_URI: {{ include "velox.mongodbUri" . | quote }}
  MONGODB_NAME: {{ .Values.mongodb.auth.database | default "velox" | quote }}

  # Redis
  REDIS_HOST: {{ include "velox.redisHost" . | quote }}
  REDIS_PORT: {{ include "velox.redisPort" . | quote }}
  REDIS_PASSWORD: {{ include "velox.redisPassword" . | quote }}

  # Session & JWT
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}

  # AWS S3
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | default "" | quote }}
  AWS_REGION: {{ .Values.secrets.awsRegion | default "us-east-1" | quote }}
  AWS_S3_BUCKET: {{ .Values.secrets.awsS3Bucket | default "" | quote }}

  # Google Cloud Storage
  GCP_PROJECT_ID: {{ .Values.secrets.gcpProjectId | default "" | quote }}
  GCP_KEY_FILE: {{ .Values.secrets.gcpKeyFile | default "" | quote }}
  GCS_BUCKET: {{ .Values.secrets.gcsBucket | default "" | quote }}

  # Azure Blob Storage
  AZURE_STORAGE_ACCOUNT: {{ .Values.secrets.azureStorageAccount | default "" | quote }}
  AZURE_STORAGE_ACCESS_KEY: {{ .Values.secrets.azureStorageAccessKey | default "" | quote }}
  AZURE_STORAGE_CONTAINER: {{ .Values.secrets.azureStorageContainer | default "" | quote }}

  # Google OAuth
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | default "" | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | default "" | quote }}
  GOOGLE_CALLBACK_URL: {{ .Values.secrets.googleCallbackUrl | default "" | quote }}

  # Email (SMTP)
  SMTP_HOST: {{ .Values.secrets.smtpHost | default "" | quote }}
  SMTP_PORT: {{ .Values.secrets.smtpPort | default "587" | quote }}
  SMTP_SECURE: {{ .Values.secrets.smtpSecure | default "false" | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | default "" | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | default "" | quote }}
  EMAIL_FROM: {{ .Values.secrets.emailFrom | default "Velox <noreply@thevelox.com>" | quote }}

  # External services
  BITLY_USER: {{ .Values.secrets.bitlyUser | default "" | quote }}
  BITLY_API_KEY: {{ .Values.secrets.bitlyApiKey | default "" | quote }}
  GOOGLE_ANALYTICS_CODE: {{ .Values.secrets.googleAnalyticsCode | default "" | quote }}
