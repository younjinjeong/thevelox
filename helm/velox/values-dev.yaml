# Development environment overrides for local Docker Desktop Kubernetes
# Usage: helm install velox ./helm/velox -f ./helm/velox/values-dev.yaml

# Reduced resources for local development
replicaCount: 1

image:
  pullPolicy: Never  # Use locally built images
  tag: "latest"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Disable autoscaling in development
autoscaling:
  enabled: false

config:
  nodeEnv: development
  logLevel: debug
  corsOrigin: "*"

# Development secrets (NOT FOR PRODUCTION)
secrets:
  sessionSecret: "dev-session-secret-for-local-development-only"
  jwtSecret: "dev-jwt-secret-for-local-development-only"

  # AWS S3 - use your development credentials
  awsAccessKeyId: "your-dev-access-key"
  awsSecretAccessKey: "your-dev-secret-key"
  awsRegion: "us-east-1"
  awsS3Bucket: "velox-dev-bucket"

  googleCallbackUrl: "http://velox.local/api/v1/auth/google/callback"

# Smaller persistence for local development
persistence:
  enabled: true
  size: 2Gi

# MongoDB - reduced resources for local
mongodb:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/mongodb
    tag: "latest"
  auth:
    rootPassword: "dev-root-password"
    username: "velox"
    password: "dev-password"
    database: "velox"
  persistence:
    enabled: true
    size: 2Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

# Redis - reduced resources for local
redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: "latest"
  auth:
    password: "dev-redis-password"
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# Faster probe intervals for development
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 3
